<!DOCTYPE html>
<html lang="hr">

<head>
    <title>Marko Varga - portfolio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="w3-black">

    <!-- Mouse Follower -->
    <div class="mouse-follower"></div>

    <!-- Language Switch Button -->
    <button id="lang-switch" class="lang-switch">EN / HR</button>

    <!-- Sidebar -->
    <nav class="w3-sidebar w3-bar-block w3-small w3-hide-small w3-center">
        <a href="#home" class="w3-bar-item w3-button w3-padding-large w3-black">
            <i class="fa fa-home w3-xxlarge"></i>
            <p id="nav-home"></p>
        </a>
        <a href="#about" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
            <i class="fa fa-user w3-xxlarge"></i>
            <p id="nav-about"></p>
        </a>
        <a href="#skills" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
            <i class="fa fa-code w3-xxlarge"></i>
            <p id="nav-skills"></p>
        </a>
        <a href="#education" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
            <i class="fa fa-graduation-cap w3-xxlarge"></i>
            <p id="nav-education"></p>
        </a>
        <a href="#experience" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
            <i class="fa fa-briefcase w3-xxlarge"></i>
            <p id="nav-experience"></p>
        </a>
        <a href="#more" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
            <i class="fa fa-info-circle w3-xxlarge"></i>
            <p id="nav-more"></p>
        </a>
        <a href="#contact" class="w3-bar-item w3-button w3-padding-large w3-hover-black">
            <i class="fa fa-envelope w3-xxlarge"></i>
            <p id="nav-contact"></p>
        </a>
    </nav>

    <!-- Mobile navbar -->
    <div class="w3-top w3-hide-large w3-hide-medium" id="myNavbar">
        <div class="w3-bar w3-black w3-opacity w3-hover-opacity-off w3-center w3-small">
            <a href="#home" class="w3-bar-item w3-button" id="nav-home-mobile"></a>
            <a href="#about" class="w3-bar-item w3-button" id="nav-about-mobile"></a>
            <a href="#skills" class="w3-bar-item w3-button" id="nav-skills-mobile"></a>
            <a href="#education" class="w3-bar-item w3-button" id="nav-education-mobile"></a>
            <a href="#experience" class="w3-bar-item w3-button" id="nav-experience-mobile"></a>
            <a href="#more" class="w3-bar-item w3-button" id="nav-more-mobile"></a>
            <a href="#contact" class="w3-bar-item w3-button" id="nav-contact-mobile"></a>
        </div>
    </div>

    <!-- Page Content -->
    <div class="w3-padding-large" id="main">

        <!-- Header -->
        <header class="w3-container w3-padding-64 parallax-header" id="home"
            style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 40px; position: relative; z-index: 1;">
            <div class="fade-in" style="animation-delay: 0.2s;">
                <h1 class="w3-jumbo"><span class="w3-hide-small">Marko </span>Varga</h1>
                <p class="w3-large" id="header-subtitle"></p>
                <p id="header-description"></p>
            </div>
            <img src="./images/banner.png" alt="Marko Varga" class="w3-image header-image fade-in"
                style="max-width: 300px; border-radius: 20px; animation-delay: 0.4s;">
        </header>

        <!-- Stats Section -->
        <div class="w3-content scroll-fade" style="margin-top: 60px;">
            <div class="stats-grid">
                <!-- Stats will be loaded dynamically -->
            </div>
        </div>

        <!-- About -->
        <div class="w3-content w3-justify w3-text-grey w3-padding-64 scroll-fade" id="about">
            <h2 class="w3-text-light-grey section-title" id="about-title"></h2>

            <div class="content-card">
                <p id="about-text-1"></p>
                <p id="about-text-2"></p>
                <p id="about-text-3"></p>
            </div>
        </div>

        <!-- Skills -->
        <div class="w3-content w3-padding-64 scroll-fade" id="skills">
            <h2 class="w3-text-light-grey section-title" id="skills-title"></h2>

            <div class="content-card">
                <div class="skills-grid">
                    <div>
                        <h3 class="w3-padding-16 w3-text-light-grey" id="programming-title"></h3>
                        <!-- Programming skills will be loaded dynamically -->
                    </div>

                    <div>
                        <h3 class="w3-padding-16 w3-text-light-grey" id="tools-title"></h3>
                        <div>
                            <!-- Tools will be loaded dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Education -->
        <div class="w3-content w3-padding-64 scroll-fade" id="education">
            <h2 class="w3-text-light-grey section-title" id="education-title"></h2>
            <!-- Education items will be loaded dynamically -->
        </div>

        <!-- Experience -->
        <div class="w3-content w3-padding-64 scroll-fade" id="experience">
            <h2 class="w3-text-light-grey section-title" id="experience-title"></h2>

            <div class="experience-grid">
                <!-- Experience cards will be loaded dynamically -->
            </div>

            <!-- Projects Carousel -->
            </br>
            <hr style="width:300px" class="w3-opacity">
            </br>

            <div class="project-carousel">
                <button class="carousel-arrow left" onclick="moveCarousel(-1)">
                    <i class="fa fa-chevron-left"></i>
                </button>

                <div class="project-track" id="projectTrack">
                    <!-- Projects will be loaded dynamically -->
                </div>

                <button class="carousel-arrow right" onclick="moveCarousel(1)">
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- More About Me -->
        <div class="w3-content w3-padding-64 scroll-fade" id="more">
            <h2 class="w3-text-light-grey section-title" id="more-title"></h2>

            <div class="skills-grid">
                <div class="content-card">
                    <h3 class="w3-text-light-grey section-title" id="languages-title"></h3>

                    <div class="languages-grid" style="justify-content: space-evenly;">
                        <div>
                            <div class="circular-progress" style="--progress: 285deg;">
                                <div class="progress-value">C1</div>
                            </div>
                            <p style="text-align: center;" id="lang-english"></p>
                        </div>
                        <div>
                            <div class="circular-progress" style="--progress: 240deg;">
                                <div class="progress-value">B2</div>
                            </div>
                            <p style="text-align: center;" id="lang-slovenian"></p>
                        </div>
                        <div>
                            <div class="circular-progress" style="--progress: 210deg;">
                                <div class="progress-value">B1</div>
                            </div>
                            <p style="text-align: center;" id="lang-german"></p>
                        </div>
                    </div>
                </div>

                <div class="content-card">
                    <h3 class="w3-text-light-grey section-title" id="hobbies-title"></h3>
                    <p id="hobbies-text-1"></p>
                    <p id="hobbies-text-2"></p>
                </div>
            </div>
        </div>

        <!-- Contact -->
        <div class="w3-content w3-padding-64 scroll-fade" id="contact">
            <h2 class="w3-text-light-grey section-title" id="contact-title"></h2>

            <div class="w3-section">
                <div class="contact-info">
                    <i class="fa fa-envelope fa-fw w3-xxlarge"></i>
                    <p>marko.varga@fer.hr</p>
                </div>
                <div class="contact-info">
                    <i class="fa fa-phone fa-fw w3-xxlarge"></i>
                    <p>+385 99 791 7970</p>
                </div>
                <div class="contact-info">
                    <i class="fa fa-globe fa-fw w3-xxlarge"></i>
                    <p>markovarga.from.hr</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="w3-content w3-padding-64 w3-text-grey w3-center">
            <p>© 2025 Marko Varga. All rights reserved.</p>
        </footer>

    </div>

    <script src="scripts/language.js"></script>
    <script src="scripts/animations.js"></script>
    <script src="scripts/carousel.js"></script>

</body>

</html>
